<text x="1020.0" y="184.0" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Artefactos</text>
<text x="1020.0" y="201.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">se conservan</text>
<text x="1020.0" y="218.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">7 días</text>
<line x1="932" y1="196" x2="954" y2="196" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="960,196 951,191 951,201" fill="#5b6b7a"/>
