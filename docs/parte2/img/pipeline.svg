<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="340" viewBox="0 0 1104 340" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Pipeline de CI</title><desc>Disparadores, job de API, job Web, job de reportería y artefactos</desc>
<rect width="1104" height="340" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="24" y="34" font-size="18" fill="#1f2937" font-weight="bold" text-anchor="start">Pipeline de CI: pruebas.yml</text>
<text x="24" y="54" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Tres jobs en cadena. Web y reportería usan if: always(), así que la evidencia se conserva si algo falla.</text>
<rect x="24" y="138" width="140" height="96" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="94.0" y="174.0" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Disparadores</text>
<text x="94.0" y="191.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">push o PR a main</text>
<text x="94.0" y="208.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">ejecución manual</text>
<rect x="196" y="78" width="224" height="236" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="308" y="100" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">job_api · API y contratos</text>
<rect x="216" y="118.0" width="184" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="308.0" y="151.0" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Karate</text>
<rect x="216" y="186.0" width="184" height="56" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="308.0" y="219.0" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Schemathesis</text>
<rect x="216" y="254.0" width="184" height="56" rx="6" fill="#e7f6ee" stroke="#b7e1c9"/>
<text x="308.0" y="278.5" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Quality Gate API</text>
<text x="308.0" y="295.5" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">Escenario A</text>
<rect x="452" y="78" width="224" height="236" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="564" y="100" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">job_web · Web E2E</text>
<rect x="472" y="132.0" width="184" height="76" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="564.0" y="166.5" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Cypress</text>
<text x="564.0" y="183.5" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">3 corridas</text>
<rect x="472" y="220.0" width="184" height="76" rx="6" fill="#e7f6ee" stroke="#b7e1c9"/>
<text x="564.0" y="254.5" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Quality Gate Web</text>
<text x="564.0" y="271.5" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">Escenario A</text>
<rect x="708" y="78" width="224" height="236" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="5 4"/>
<text x="820" y="100" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">job_reporting · Reportería</text>
<rect x="728" y="132.0" width="184" height="76" rx="6" fill="#e7f6ee" stroke="#b7e1c9"/>
<text x="820.0" y="166.5" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Decisión final</text>
<text x="820.0" y="183.5" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">del mismo run</text>
<rect x="728" y="220.0" width="184" height="76" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="820.0" y="254.5" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Matriz y reporte</text>
<text x="820.0" y="271.5" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">consolidado</text>
