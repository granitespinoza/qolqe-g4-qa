<text x="466.5" y="154" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">9</text>
<text x="510.0" y="154" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">sin omitidos ni intermitencia</text>
<text x="24" y="204" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Corrida 3</text>
<rect x="120" y="184" width="315.0" height="30" rx="3" fill="#2f9e6b"/>
<text x="277.5" y="204" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">45 PASS</text>
