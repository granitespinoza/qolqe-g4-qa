<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Estabilidad de la suite web</title><desc>Tres corridas con 45 aprobados y 9 fallos conocidos cada una</desc>
<rect width="900" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="24" y="34" font-size="18" fill="#1f2937" font-weight="bold" text-anchor="start">Estabilidad: tres corridas completas, mismo resultado</text>
<text x="24" y="54" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Reintentos de tests: 0. Esperas fijas: 0. Las consultas y aserciones de Cypress reintentan hasta 4000 ms.</text>
