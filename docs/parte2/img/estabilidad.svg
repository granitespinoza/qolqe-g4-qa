<text x="466.5" y="204" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">9</text>
<text x="510.0" y="204" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">sin omitidos ni intermitencia</text>
<text x="24" y="252" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Qué encontró el pipeline remoto: Qolqe valida «hoy» en hora de Lima; un runner en UTC enviaba una fecha futura entre 00:00 y 05:00 UTC.</text>
<text x="24" y="272" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Se fijó TZ: America/Lima en el job Web en lugar de cambiar tests o firmas del gate.</text>
