<text x="466.5" y="104" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">9</text>
<text x="510.0" y="104" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">sin omitidos ni intermitencia</text>
<text x="24" y="154" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Corrida 2</text>
