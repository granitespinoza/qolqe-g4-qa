<text x="24" y="54" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Run 41152595167 de main: 14 min 19 s de reloj (7 min 41 s de ejecución real y 6 min 33 s de espera antes del primer job; el resto, pausas entre jobs).</text>
<rect x="24.0" y="82" width="432.6" height="34" fill="#cbd5e1"/>
<text x="240.28805620608898" y="104" font-size="12" fill="#1f2937" font-weight="bold" text-anchor="middle">Espera en cola · 6 min 33 s</text>
