<text x="526.4707259953161" y="104" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">job_api · 2 min 07 s</text>
<rect x="596.4" y="82" width="357.7" height="34" fill="#1f9aa6"/>
<text x="775.2295081967212" y="104" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">job_web · 5 min 25 s</text>
