<rect x="270" y="334" width="338.4" height="20" rx="2" fill="#1f9aa6"/>
<text x="616.4000000000001" y="349" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">1 min 34 s</text>
