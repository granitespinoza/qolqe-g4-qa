<text x="24" y="444" font-size="11" fill="#5b6b7a" font-weight="normal" text-anchor="start">Karate 75 s y Schemathesis 20 s salen del execution.json de cada herramienta; las tres corridas de Cypress, de su manifiesto de estabilidad.</text>
<text x="24" y="462" font-size="11" fill="#5b6b7a" font-weight="normal" text-anchor="start">El resto de cada job son el gate, la consolidación y la publicación de artefactos.</text>
