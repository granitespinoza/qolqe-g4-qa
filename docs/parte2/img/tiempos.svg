<text x="616.4000000000001" y="379" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">1 min 34 s</text>
<text x="24" y="410" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">Reportería y matriz</text>
