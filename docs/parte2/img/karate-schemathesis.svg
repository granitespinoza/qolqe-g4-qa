<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Karate y Schemathesis</title><desc>Qué prueba cada herramienta, su resultado, duración y dónde se ve la evidencia</desc>
<rect width="1000" height="416" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="24" y="34" font-size="18" fill="#1f2937" font-weight="bold" text-anchor="start">Karate y Schemathesis: qué prueba cada uno y dónde se ve</text>
<text x="24" y="54" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Cifras del run verde de main 41152595167. &lt;run&gt; es la carpeta del run dentro del artefacto entrega-parte2.</text>
<rect x="24" y="76" width="456" height="262" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="76" width="456" height="36" rx="8" fill="#3b82c4"/>
<text x="42" y="100" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">Karate · API</text>
<text x="42" y="138" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Qué prueba</text>
<text x="154" y="138" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">reglas de negocio, estados y efectos</text>
<text x="42" y="164" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Cómo</text>
<text x="154" y="164" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">casos diseñados, con esperado justificado</text>
<text x="42" y="190" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Resultado</text>
<text x="154" y="190" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">169 PASS · 12 conocidos (181 ejecuciones)</text>
<text x="42" y="216" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Duración en CI</text>
<text x="154" y="216" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">75 s</text>
<text x="42" y="258" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Dónde se ve</text>
<rect x="42" y="268" width="420" height="24" rx="4" fill="#f1f5f9"/>
<text x="52" y="285" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">reports/raw/karate/&lt;run&gt;/karate-summary.html</text>
<rect x="42" y="298" width="420" height="24" rx="4" fill="#f1f5f9"/>
<text x="52" y="315" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">evidencias/G4-004.html (caso de la ñ, en el repo)</text>
<rect x="520" y="76" width="456" height="262" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="520" y="76" width="456" height="36" rx="8" fill="#1f9aa6"/>
<text x="538" y="100" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start">Schemathesis · Contrato</text>
<text x="538" y="138" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Qué prueba</text>
<text x="650" y="138" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">que la API cumpla el contrato OpenAPI</text>
<text x="538" y="164" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Cómo</text>
<text x="650" y="164" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">datos generados automáticamente</text>
<text x="538" y="190" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Resultado</text>
<text x="650" y="190" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">27 ocurrencias, todas conocidas</text>
<text x="538" y="216" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Duración en CI</text>
<text x="650" y="216" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="start">20 s</text>
<text x="538" y="258" font-size="12" fill="#5b6b7a" font-weight="bold" text-anchor="start">Dónde se ve</text>
<rect x="538" y="268" width="420" height="24" rx="4" fill="#f1f5f9"/>
<text x="548" y="285" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">reports/raw/schemathesis/&lt;run&gt;/schemathesis-detallado.html</text>
<rect x="538" y="298" width="420" height="24" rx="4" fill="#f1f5f9"/>
<text x="548" y="315" font-size="12" fill="#1f2937" font-weight="normal" text-anchor="start">reports/schemathesis-detallado.html (copia en el repo)</text>
<rect x="24" y="352" width="952" height="40" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="500" y="377" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="middle">Se complementan: Schemathesis descubre diferencias con el contrato; Karate las confirma con un esperado justificado.</text>
</svg>
