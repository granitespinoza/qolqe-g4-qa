<text x="704" y="113" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Matriz navegable</text>
<text x="754.0" y="148" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">apidoc/parte2/</text>
<text x="754.0" y="166" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">index.html</text>
<line x1="850" y1="144" x2="864" y2="144" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="870,144 861,139 861,149" fill="#5b6b7a"/>
<rect x="872" y="84" width="188" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<circle cx="896" cy="108" r="13" fill="#3b82c4"/><text x="896" y="113" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<text x="916" y="113" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Reportes</text>
<text x="966.0" y="148" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">Karate, Cypress y</text>
<text x="966.0" y="166" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">Schemathesis</text>
<text x="24" y="236" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Los HTML hay que servirlos (python -m http.server); los enlaces a reports/ del repo no existen porque esas carpetas no se versionan.</text>
<text x="24" y="256" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">El artefacto caduca a los 7 días: descargarlo antes de la exposición. El resumen permanente está en docs/parte2/resultado-gate.md.</text>
