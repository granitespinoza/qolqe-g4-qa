<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="284" viewBox="0 0 1120 284" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Reportería de la demo</title><desc>Cinco pasos para mostrar la reportería, del run de Actions a los reportes por herramienta</desc>
<rect width="1120" height="284" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="24" y="34" font-size="18" fill="#1f2937" font-weight="bold" text-anchor="start">Dónde se muestra la reportería en la demo</text>
<text x="24" y="54" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">Del run en Actions a los reportes por herramienta, en este orden.</text>
