<text x="280" y="113" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Resumen del run</text>
<text x="330.0" y="148" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">enlace al artefacto</text>
<text x="330.0" y="166" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">entrega-parte2</text>
<line x1="426" y1="144" x2="440" y2="144" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="446,144 437,139 437,149" fill="#5b6b7a"/>
<rect x="448" y="84" width="188" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
<circle cx="472" cy="108" r="13" fill="#3b82c4"/><text x="472" y="113" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="492" y="113" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Decisión del gate</text>
<text x="542.0" y="148" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">reports/gate/</text>
<text x="542.0" y="166" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">resumen.md</text>
<line x1="638" y1="144" x2="652" y2="144" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="658,144 649,139 649,149" fill="#5b6b7a"/>
<rect x="660" y="84" width="188" height="120" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
