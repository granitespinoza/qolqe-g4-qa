<circle cx="48" cy="108" r="13" fill="#3b82c4"/><text x="48" y="113" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="68" y="113" font-size="13" fill="#1f2937" font-weight="bold" text-anchor="start">Actions</text>
<text x="118.0" y="148" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">el run con los</text>
<text x="118.0" y="166" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="middle">tres jobs en verde</text>
<line x1="214" y1="144" x2="228" y2="144" stroke="#5b6b7a" stroke-width="2"/>
<polygon points="234,144 225,139 225,149" fill="#5b6b7a"/>
