name: Preparar QA
description: Referencia original y dependencias comunes fijadas
inputs:
  java:
    default: 'false'
  web:
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v4
      if: inputs.java == 'true'
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-node@v4
      if: inputs.web == 'true'
      with:
        node-version: '24'
        cache: npm
    - shell: bash
      run: |
        git clone https://github.com/cjudihtroj/qolqe-wallet.git referencias/qolqe-wallet
        git -C referencias/qolqe-wallet checkout 8c7d2f0c939ede7765b7b80b98c10c3905693fda
        python -m pip install -r requirements-lock.txt
        python -m pip check
    - shell: bash
      if: inputs.java == 'true'
      run: |
        mkdir -p .tools
        curl -fL https://github.com/karatelabs/karate/releases/download/v1.5.2/karate-1.5.2.jar -o .tools/karate.jar
    - shell: bash
      if: inputs.web == 'true'
      run: |
        npm ci --no-audit --no-fund
        npx cypress verify
        npm run cy:typecheck
