name: API G4 — Karate y contrato
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [karate, schemathesis]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar versión de referencia y herramientas
        run: |
          git clone https://github.com/cjudihtroj/qolqe-wallet.git referencias/qolqe-wallet
          git -C referencias/qolqe-wallet checkout 8c7d2f0c939ede7765b7b80b98c10c3905693fda
          mkdir -p .tools
          curl -fL https://github.com/karatelabs/karate/releases/download/v1.5.2/karate-1.5.2.jar -o .tools/karate.jar
          pip install -r referencias/qolqe-wallet/requirements.txt -r requirements-qa.txt
      - name: Ejecutar pruebas sin ocultar fallos
        run: python scripts/run_qa.py ${{ matrix.tool }} --start-api
      - name: Conservar reportes incluso ante fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.tool }}
          path: reports/raw/
          retention-days: 7
